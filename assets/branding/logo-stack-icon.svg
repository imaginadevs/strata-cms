<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="t">
  <title id="t">Strata — stacked layers mark</title>
  <style>
    @media (prefers-color-scheme: dark) {
      .layer-deep { fill: #3b82f6; }
    }
  </style>
  <!-- bottom layer (foundation) -->
  <polygon class="layer-deep" fill="#1e40af" points="56,76 94,92 56,108 18,92" />
  <!-- middle layer -->
  <polygon fill="#2563eb" points="64,48 102,64 64,80 26,64" />
  <!-- top layer (newest content) -->
  <polygon fill="#60a5fa" points="72,20 110,36 72,52 34,36" />
</svg>

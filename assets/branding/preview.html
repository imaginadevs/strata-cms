<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Strata logo preview</title>
<style>
  body { margin: 0; font-family: Inter, 'Segoe UI', system-ui, sans-serif; color: #0f172a; background:#fff; }
  h1 { font-size: 18px; padding: 20px 24px 0; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: #64748b; margin: 28px 24px 8px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 0 24px; }
  .cell { border-radius: 16px; padding: 28px; display: flex; flex-direction: column; gap: 22px; align-items: center; }
  .light { background: #eef1f8; border: 1px solid #e2e8f0; }
  .dark  { background: #0b1220; }
  .sizes { display: flex; align-items: flex-end; gap: 20px; }
  .tag { font-size: 11px; color: #94a3b8; }
  .dark .tag { color:#64748b; }
  svg { display:block; }
</style>
</head>
<body>
  <h1>Strata — logo (stacked layers)</h1>

  <h2>Concept A · Stacked layers</h2>
  <div class="row">
    <div class="cell light">
      <div class="sizes">
        <svg width="96" height="96" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg"><polygon fill="#1e40af" points="56,76 94,92 56,108 18,92"/><polygon fill="#2563eb" points="64,48 102,64 64,80 26,64"/><polygon fill="#60a5fa" points="72,20 110,36 72,52 34,36"/></svg>
        <svg width="48" height="48" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg"><polygon fill="#1e40af" points="56,76 94,92 56,108 18,92"/><polygon fill="#2563eb" points="64,48 102,64 64,80 26,64"/><polygon fill="#60a5fa" points="72,20 110,36 72,52 34,36"/></svg>
        <svg width="32" height="32" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg"><polygon fill="#1e40af" points="56,76 94,92 56,108 18,92"/><polygon fill="#2563eb" points="64,48 102,64 64,80 26,64"/><polygon fill="#60a5fa" points="72,20 110,36 72,52 34,36"/></svg>
      </div>
      <svg height="56" viewBox="0 0 270 128" xmlns="http://www.w3.org/2000/svg"><g transform="translate(8,34.2) scale(0.466)"><polygon fill="#1e40af" points="56,76 94,92 56,108 18,92"/><polygon fill="#2563eb" points="64,48 102,64 64,80 26,64"/><polygon fill="#60a5fa" points="72,20 110,36 72,52 34,36"/></g><text x="74" y="85" fill="#0f172a" font-family="Inter,'Segoe UI',sans-serif" font-size="58" font-weight="700" letter-spacing="-1">Strata</text></svg>
      <div class="tag">light background</div>
    </div>
    <div class="cell dark">
      <div class="sizes">
        <svg width="96" height="96" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg"><polygon fill="#3b82f6" points="56,76 94,92 56,108 18,92"/><polygon fill="#2563eb" points="64,48 102,64 64,80 26,64"/><polygon fill="#60a5fa" points="72,20 110,36 72,52 34,36"/></svg>
        <svg width="48" height="48" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg"><polygon fill="#3b82f6" points="56,76 94,92 56,108 18,92"/><polygon fill="#2563eb" points="64,48 102,64 64,80 26,64"/><polygon fill="#60a5fa" points="72,20 110,36 72,52 34,36"/></svg>
        <svg width="32" height="32" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg"><polygon fill="#3b82f6" points="56,76 94,92 56,108 18,92"/><polygon fill="#2563eb" points="64,48 102,64 64,80 26,64"/><polygon fill="#60a5fa" points="72,20 110,36 72,52 34,36"/></svg>
      </div>
      <svg height="56" viewBox="0 0 270 128" xmlns="http://www.w3.org/2000/svg"><g transform="translate(8,34.2) scale(0.466)"><polygon fill="#3b82f6" points="56,76 94,92 56,108 18,92"/><polygon fill="#2563eb" points="64,48 102,64 64,80 26,64"/><polygon fill="#60a5fa" points="72,20 110,36 72,52 34,36"/></g><text x="74" y="85" fill="#f1f5f9" font-family="Inter,'Segoe UI',sans-serif" font-size="58" font-weight="700" letter-spacing="-1">Strata</text></svg>
      <div class="tag">dark background</div>
    </div>
  </div>
</body>
</html>
